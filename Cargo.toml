[package]
name = "mynotch"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/mynotch-voice", "tools/voicectl"]
# So a plain `cargo test` / `cargo clippy` covers voice too (`cargo run` still means the notch).
default-members = [".", "crates/mynotch-voice"]

[dependencies]
mynotch-voice = { path = "crates/mynotch-voice" }
sysinfo = "0.39.6"
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = ["Data_Json", "Media_Control", "Storage_Streams", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Globalization", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinHttp"] }

# A Debug build of whisper.cpp is far too slow to use. whisper-rs-sys 0.15 already builds it
# with CMake's Release config whatever the profile; this keeps the -sys crate optimised in
# debug builds as well, should a later version follow the cmake crate's default instead
# (Debug at opt-level 0).
[profile.dev.package.whisper-rs-sys]
opt-level = 3
